<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#FFF6EA">
<title>今天的問候圖 · 遇見中藥</title>
<meta name="description" content="每天一張溫暖的問候圖，一鍵傳給家人。">
<meta property="og:title" content="今天的問候圖 · 遇見中藥">
<meta property="og:description" content="每天一張溫暖的問候圖，一鍵傳給家人。">
<meta property="og:image" content="https://10wang-creat.github.io/goji-morning/icons/icon-512.png">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  :root{
    --ink:#5A4632; --soft:#8B7355; --line:#EFE2D2;
    --bg:#FFF6EA; --card:#FFFFFF; --line-green:#06C755; --accent:#C7553F;
  }
  body{
    font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
    background:var(--bg); color:var(--ink); font-size:19px; line-height:1.7;
    padding-bottom:40px;
  }
  .wrap{max-width:560px;margin:0 auto;padding:0 16px}
  .hidden{display:none !important}

  header{text-align:center;padding:22px 0 6px}
  header .greet{font-size:30px;font-weight:700;color:var(--accent);letter-spacing:2px}
  header .date{font-size:17px;color:var(--soft);margin-top:4px}

  .photo{
    position:relative;background:var(--card);border-radius:22px;overflow:hidden;margin-top:16px;
    box-shadow:0 6px 22px rgba(150,110,70,.13);min-height:200px;
  }
  .photo img{width:100%;height:auto;display:block}
  .under{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:10px}
  .caption{color:var(--soft);font-size:17px;line-height:1.5;padding-left:4px}
  .heart{
    flex:0 0 auto;border:2px solid var(--line);background:#fff;color:var(--soft);border-radius:999px;cursor:pointer;
    font-family:inherit;font-size:19px;padding:9px 18px;min-height:50px;white-space:nowrap;
  }
  .heart.on{color:#D5402F;border-color:#F0B8AE;background:#FFF1EE;font-weight:700}

  .btn{
    display:flex;align-items:center;justify-content:center;gap:10px;
    width:100%;border:none;border-radius:18px;cursor:pointer;
    font-family:inherit;font-size:23px;font-weight:700;padding:20px 16px;margin-top:14px;
    text-decoration:none;
  }
  .btn-line{background:var(--line-green);color:#fff;box-shadow:0 6px 16px rgba(6,199,85,.35)}
  .btn-save{background:#fff;color:var(--accent);border:2px solid var(--accent)}
  .btn-ghost{background:#fff;color:var(--soft);font-size:20px;font-weight:500;padding:14px;border:2px solid var(--line)}
  .btn:active{transform:scale(.98)}
  .row{display:flex;gap:12px}
  .row .btn{margin-top:12px}

  .hint{text-align:center;color:var(--soft);font-size:17px;margin-top:14px;line-height:1.8}
  .quote{
    background:#fff;border:1px dashed var(--line);border-radius:16px;
    padding:14px 16px;margin-top:14px;text-align:center;font-size:19px;color:var(--soft)
  }
  .quote b{color:var(--ink);font-size:21px}

  .topbar{display:flex;align-items:center;gap:12px;padding:16px 0 4px}
  .back{background:#fff;border:2px solid var(--line);border-radius:14px;padding:10px 18px;font-size:19px;color:var(--ink);cursor:pointer;font-family:inherit;white-space:nowrap}
  .topbar h2{font-size:22px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  /* 圖庫分類 */
  .chips{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
  .chip{
    border:2px solid var(--line);background:#fff;color:var(--ink);border-radius:16px;cursor:pointer;
    font-family:inherit;font-size:19px;font-weight:500;padding:13px 4px;min-height:58px;
  }
  .chip.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
  .tabnote{font-size:17px;color:var(--soft);margin:14px 2px 0}
  .gtitle{font-size:22px;font-weight:700;margin:24px 0 0;color:var(--accent)}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
  .cell{position:relative;border-radius:14px;overflow:hidden;background:#fff;box-shadow:0 3px 10px rgba(150,110,70,.12);cursor:pointer}
  .cell img{width:100%;aspect-ratio:1/1;object-fit:contain;display:block;background:#fff}
  .cell .fav{position:absolute;top:6px;right:8px;font-size:22px;color:#E0453A;text-shadow:0 1px 3px #fff}
  .empty{text-align:center;color:var(--soft);padding:44px 10px;font-size:19px;line-height:2}

  /* 教學彈窗 */
  .mask{position:fixed;inset:0;background:rgba(60,40,25,.55);display:flex;align-items:center;justify-content:center;padding:20px;z-index:50}
  .modal{background:#fff;border-radius:22px;padding:24px;max-width:420px;width:100%}
  .modal h3{font-size:24px;color:var(--accent);margin-bottom:12px;text-align:center}
  .step{display:flex;gap:12px;align-items:flex-start;margin:12px 0;font-size:19px}
  .num{flex:0 0 34px;height:34px;border-radius:50%;background:var(--accent);color:#fff;text-align:center;line-height:34px;font-weight:700}

  .toast{
    position:fixed;left:50%;bottom:36px;transform:translateX(-50%);z-index:60;
    background:rgba(70,52,36,.94);color:#fff;font-size:19px;padding:12px 22px;border-radius:999px;white-space:nowrap;
  }
  footer{text-align:center;color:var(--soft);font-size:16px;padding:28px 0 10px}
</style>
</head>
<body>

<div class="wrap">

  <!-- 首頁 -->
  <section id="home">
    <header>
      <div class="greet" id="greetText">早安</div>
      <div class="date" id="dateText"></div>
    </header>

    <div class="photo">
      <img id="todayImg" alt="今天的問候圖" src="">
    </div>
    <div class="under">
      <div class="caption" id="todayFrom"></div>
      <button class="heart" id="todayHeart" onclick="toggleFav()">♡ 收藏</button>
    </div>

    <button class="btn btn-line" onclick="sharePic()"><span>💬</span><span>傳給家人</span></button>

    <div class="row">
      <button class="btn btn-ghost" onclick="nextPic()">🔄 換一張</button>
      <button class="btn btn-ghost" onclick="go('gallery')">🌿 看全部</button>
    </div>

    <div class="quote">
      今天想說的話：<br><b id="greetLine">早安，願你今天平安順心 🌿</b><br>
      <button class="btn btn-ghost" style="margin-top:10px" onclick="copyLine()">📋 複製這句話</button>
    </div>
  </section>

  <!-- 圖庫 -->
  <section id="gallery" class="hidden">
    <div class="topbar">
      <button class="back" onclick="history.back()">← 回首頁</button>
      <h2>全部問候圖</h2>
    </div>
    <div class="chips" id="chips"></div>
    <div class="tabnote" id="tabNote"></div>
    <div id="galleryBody"></div>
  </section>

  <!-- 單張 -->
  <section id="detail" class="hidden">
    <div class="topbar">
      <button class="back" onclick="history.back()">← 回上一頁</button>
      <h2 id="detailTitle"></h2>
    </div>
    <div class="photo">
      <img id="detailImg" alt="問候圖" src="">
    </div>
    <div class="under">
      <div class="caption" id="detailFrom"></div>
      <button class="heart" id="detailHeart" onclick="toggleFav()">♡ 收藏</button>
    </div>
    <button class="btn btn-line" onclick="sharePic()"><span>💬</span><span>傳給家人</span></button>
    <div class="row">
      <button class="btn btn-ghost" onclick="step(-1)">← 上一張</button>
      <button class="btn btn-ghost" onclick="step(1)">下一張 →</button>
    </div>
  </section>

  <footer>遇見中藥 Meet the Herbs · 本草工作室</footer>
</div>

<!-- 存圖教學（手機不支援直接分享時才會出現） -->
<div class="mask hidden" id="howto" onclick="if(event.target===this)closeHowto()">
  <div class="modal">
    <h3>怎麼傳到 LINE？</h3>
    <div class="step"><div class="num">1</div><div>先按下面的<b>「儲存圖片」</b>，圖會存進手機相簿</div></div>
    <div class="step"><div class="num">2</div><div>打開 LINE，進入想傳的群組或聊天室</div></div>
    <div class="step"><div class="num">3</div><div>按左下角的 <b>圖片</b> 圖示，選剛存好的圖，送出</div></div>
    <a class="btn btn-save" id="saveLink" href="" download="問候圖.jpg">💾 儲存圖片</a>
    <button class="btn btn-ghost" onclick="closeHowto()">關閉</button>
  </div>
</div>
<div class="toast hidden" id="toast"></div>

<script src="data.js"></script>
<script>
  // ============ 狀態（全部先宣告，避免載入順序出錯） ============
  var ITEMS = [];            // 全部圖片
  var current = null;        // 目前畫面上的那張
  var currentFile = null;    // 已備好、可直接分享的檔案
  var todayQueue = [];       // 首頁輪播順序
  var todayPos = 0;
  var listNow = [];          // 圖庫目前這個分類的清單（給上一張／下一張用）
  var tabNow = 'season';
  var galleryScroll = 0;
  var favs = loadFavs();
  var now = new Date();
  function $(id){ return document.getElementById(id); }

  // ============ 資料 ============
  TOPICS.forEach(function(t){
    if (t.gold) ITEMS.push({src:'gold/'+t.slug+'.jpg', name:t.name, num:t.num, m:t.m, fest:t.fest, kind:'gold'});
    t.files.forEach(function(f){
      ITEMS.push({src:'images/'+t.slug+'/'+f, name:t.name, num:t.num, m:t.m, fest:t.fest, kind:'quote'});
    });
  });
  function thumb(it){ return 'thumbs/' + it.src; }
  function kindName(it){ return it.kind === 'gold' ? '金句海報' : '隨手語錄'; }

  // ============ 季節與節慶 ============
  // 農曆節日的國曆日期（查不到那一年時，改用大約的月份區間）
  var FEST = {
    cny:       {name:'春節', before:21, after:15, fb:[1,15,2,20],
                d:{2026:'2-17',2027:'2-6',2028:'1-26',2029:'2-13',2030:'2-3'}},
    duanwu:    {name:'端午', before:10, after:2,  fb:[5,25,6,20],
                d:{2026:'6-19',2027:'6-9',2028:'5-28',2029:'6-16',2030:'6-5'}},
    midautumn: {name:'中秋', before:10, after:3,  fb:[9,5,10,5],
                d:{2026:'9-25',2027:'9-15',2028:'10-3',2029:'9-22',2030:'9-12'}}
  };
  function dayDiff(a, b){ return Math.round((a - b) / 86400000); }
  function midnight(d){ return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }
  // 回傳：null=不在節慶期間；數字=距離節日幾天（0 是當天，負的是節前）
  function festOffset(key){
    var f = FEST[key]; if (!f) return null;
    var y = now.getFullYear(), s = f.d[y], t = midnight(now);
    if (s) {
      var p = s.split('-'), off = dayDiff(t, new Date(y, p[0]-1, +p[1]));
      return (off >= -f.before && off <= f.after) ? off : null;
    }
    var a = new Date(y, f.fb[0]-1, f.fb[1]), b = new Date(y, f.fb[2]-1, f.fb[3]);
    return (t >= a && t <= b) ? -99 : null;   // 沒有確切日期：只知道在期間內
  }
  function inSeason(it){
    if (it.fest) return festOffset(it.fest) !== null;
    if (!it.m) return true;
    var d = Math.abs(it.m - (now.getMonth() + 1));
    return Math.min(d, 12 - d) <= 1;          // 這個月與前後各一個月
  }

  // 固定亂數：同一個月大家看到的順序一樣，而且輪完才會重複
  function shuffled(arr, seed){
    var a = arr.slice(), s = seed >>> 0;
    function rnd(){ s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(rnd() * (i + 1)), x = a[i]; a[i] = a[j]; a[j] = x;
    }
    return a;
  }
  function buildTodayQueue(){
    var pool = ITEMS.filter(inSeason);
    if (pool.length < 10) pool = ITEMS.filter(function(it){ return !it.fest; });
    var order = shuffled(pool, now.getFullYear() * 100 + now.getMonth() + 1);
    var start = (now.getDate() - 1) % order.length;
    var q = order.slice(start).concat(order.slice(0, start));
    // 節日當天與前一天：先放節慶的圖
    var hot = ITEMS.filter(function(it){
      if (!it.fest) return false;
      var o = festOffset(it.fest); return o === 0 || o === -1;
    });
    if (hot.length) {
      var pick = shuffled(hot, now.getFullYear() * 1000 + now.getMonth() * 40 + now.getDate());
      q = pick.concat(q.filter(function(it){ return pick.indexOf(it) < 0; }));
    }
    return q;
  }

  // ============ 今日問候 ============
  (function(){
    var h = now.getHours();
    var greet = h < 11 ? '早安' : (h < 17 ? '午安' : '晚安');
    var lines = {
      '早安': '早安，願你今天平安順心 🌿',
      '午安': '午安，記得喝口溫水，慢慢來 🍵',
      '晚安': '晚安，今天辛苦了，好好休息 🌙'
    };
    $('greetText').textContent = greet;
    $('greetLine').textContent = lines[greet];
    var wd = ['日','一','二','三','四','五','六'][now.getDay()];
    $('dateText').textContent = now.getFullYear() + ' 年 ' + (now.getMonth()+1) + ' 月 ' + now.getDate() + ' 日　星期' + wd;
  })();

  function showToday(){
    current = todayQueue[todayPos];
    $('todayImg').src = current.src;
    $('todayFrom').textContent = current.name + '・' + kindName(current);
    paintHearts();
    prefetch(current.src);
  }
  function nextPic(){
    todayPos = (todayPos + 1) % todayQueue.length;
    showToday();
    window.scrollTo({top:0, behavior:'smooth'});
  }

  // ============ 傳給家人 ============
  // 先把圖片抓成檔案備好，按下按鈕時才能「直接」叫出分享（手機才不會被擋）
  function prefetch(src){
    currentFile = null;
    fetch(src).then(function(r){ return r.blob(); }).then(function(b){
      if (current && current.src === src) currentFile = new File([b], '問候圖.jpg', {type:'image/jpeg'});
    }).catch(function(){});
  }
  function sharePic(){
    if (currentFile && navigator.canShare && navigator.canShare({files:[currentFile]})) {
      navigator.share({files:[currentFile]}).catch(function(e){
        if (!e || e.name !== 'AbortError') openHowto(current.src);
      });
      return;
    }
    openHowto(current.src);
  }
  function openHowto(src){ $('saveLink').href = src; $('howto').classList.remove('hidden'); }
  function closeHowto(){ $('howto').classList.add('hidden'); }

  var toastTimer = null;
  function toast(msg){
    var t = $('toast'); t.textContent = msg; t.classList.remove('hidden');
    clearTimeout(toastTimer); toastTimer = setTimeout(function(){ t.classList.add('hidden'); }, 1800);
  }
  function copyLine(){
    var t = $('greetLine').textContent;
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(t).then(function(){ toast('已複製，可以貼到 LINE 囉'); },
                                            function(){ toast('複製失敗，請長按文字複製'); });
    } else { toast('請長按上面那句話來複製'); }
  }

  // ============ 收藏（存在這支手機裡） ============
  function loadFavs(){
    try { var v = JSON.parse(localStorage.getItem('goji-favs') || '[]'); return Array.isArray(v) ? v : []; }
    catch(e){ return []; }
  }
  function saveFavs(){ try { localStorage.setItem('goji-favs', JSON.stringify(favs)); } catch(e){} }
  function isFav(src){ return favs.indexOf(src) >= 0; }
  function toggleFav(){
    if (!current) return;
    var i = favs.indexOf(current.src);
    if (i >= 0) { favs.splice(i, 1); toast('已取消收藏'); }
    else { favs.unshift(current.src); toast('已加入收藏 ♥'); }
    saveFavs(); paintHearts();
    $('galleryBody').dataset.tab = '';       // 下次回圖庫時重畫，愛心才會更新
  }
  function paintHearts(){
    var on = current && isFav(current.src);
    ['todayHeart','detailHeart'].forEach(function(id){
      $(id).textContent = on ? '♥ 已收藏' : '♡ 收藏';
      $(id).classList.toggle('on', !!on);
    });
  }

  // ============ 圖庫 ============
  var TABS = [
    {id:'season', label:'🍂 當季'},
    {id:'new',    label:'🆕 最新'},
    {id:'fav',    label:'❤️ 收藏'},
    {id:'gold',   label:'✨ 金句'},
    {id:'quote',  label:'🌿 語錄'},
    {id:'fest',   label:'🎉 節慶'}
  ];
  function drawChips(){
    $('chips').innerHTML = TABS.map(function(t){
      return '<button class="chip' + (t.id === tabNow ? ' on' : '') + '" onclick="setTab(\'' + t.id + '\')">' + t.label + '</button>';
    }).join('');
  }
  function setTab(id){ tabNow = id; drawChips(); drawGallery(); window.scrollTo(0, 0); }

  function cells(list){
    return '<div class="grid">' + list.map(function(it){
      var i = listNow.push(it) - 1;
      return '<div class="cell" onclick="openDetail(' + i + ')">' +
             '<img loading="lazy" decoding="async" src="' + thumb(it) + '" alt="' + it.name + '">' +
             (isFav(it.src) ? '<span class="fav">♥</span>' : '') + '</div>';
    }).join('') + '</div>';
  }
  function grouped(list){
    var html = '', last = null, buf = [];
    function flush(){ if (buf.length) html += '<div class="gtitle">' + last + '</div>' + cells(buf); buf = []; }
    list.forEach(function(it){ if (it.name !== last) { flush(); last = it.name; } buf.push(it); });
    flush(); return html;
  }
  function drawGallery(){
    var box = $('galleryBody'), note = '', html = '';
    listNow = [];
    if (tabNow === 'season') {
      note = '適合現在這個季節傳的圖，新的排前面。';
      html = cells(ITEMS.filter(inSeason));
    } else if (tabNow === 'new') {
      var top = TOPICS.slice(0, 6).map(function(t){ return t.num; });
      note = '最近六週新增的圖。';
      html = grouped(ITEMS.filter(function(it){ return top.indexOf(it.num) >= 0; }));
    } else if (tabNow === 'fav') {
      var mine = favs.map(function(s){ return ITEMS.filter(function(it){ return it.src === s; })[0]; })
                     .filter(Boolean);
      note = mine.length ? '你按過愛心的圖，共 ' + mine.length + ' 張。' : '';
      html = mine.length ? cells(mine)
           : '<div class="empty">還沒有收藏的圖。<br>看到喜歡的，按圖片下面的「♡ 收藏」就會存到這裡。</div>';
    } else if (tabNow === 'gold') {
      note = '角色說的一句話，配一張圖。';
      html = cells(ITEMS.filter(function(it){ return it.kind === 'gold'; }));
    } else if (tabNow === 'quote') {
      note = '每週五的詩意小語，依藥材分組。';
      html = grouped(ITEMS.filter(function(it){ return it.kind === 'quote'; }));
    } else if (tabNow === 'fest') {
      note = '過年、端午、中秋專用的圖。';
      ['cny','duanwu','midautumn'].forEach(function(k){
        var l = ITEMS.filter(function(it){ return it.fest === k; });
        if (l.length) html += '<div class="gtitle">' + FEST[k].name + '</div>' + cells(l);
      });
    }
    $('tabNote').textContent = note;
    box.innerHTML = html;
    box.dataset.tab = tabNow;
  }

  function openDetail(i){
    galleryScroll = window.scrollY;
    showDetail(i);
    go('detail');
  }
  var detailPos = 0;
  function showDetail(i){
    detailPos = i; current = listNow[i];
    $('detailImg').src = current.src;
    $('detailTitle').textContent = current.name;
    $('detailFrom').textContent = kindName(current) + '　' + (i + 1) + ' / ' + listNow.length;
    paintHearts();
    prefetch(current.src);
  }
  function step(d){
    if (!listNow.length) return;
    showDetail((detailPos + d + listNow.length) % listNow.length);
    window.scrollTo(0, 0);
  }

  // ============ 換頁（手機的「返回」鍵也能用） ============
  function show(id){
    ['home','gallery','detail'].forEach(function(s){ $(s).classList.toggle('hidden', s !== id); });
    closeHowto();
    if (id === 'gallery') {
      if ($('galleryBody').dataset.tab !== tabNow) { drawChips(); drawGallery(); }
      window.scrollTo(0, galleryScroll);
    } else {
      if (id === 'home') { current = todayQueue[todayPos]; paintHearts(); prefetch(current.src); galleryScroll = 0; }
      window.scrollTo(0, 0);
    }
  }
  function go(id){
    try { history.pushState({v:id}, ''); } catch(e){}
    show(id);
  }
  window.addEventListener('popstate', function(e){
    show((e.state && e.state.v) || 'home');
  });

  // ============ 啟動 ============
  try { history.replaceState({v:'home'}, ''); } catch(e){}
  todayQueue = buildTodayQueue();
  showToday();
